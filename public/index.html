<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071622" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CaliSurf Light" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CaliSurf Light</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://server.arcgisonline.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <img class="app-logo" src="assets/icons/logo-white-transparent.png" alt="CaliSurf Light logo" />
        <div>
          <p class="eyebrow">west coast model V1</p>
          <h1>CaliSurf Light</h1>
          <p class="refresh-line" id="modelRefresh">model refresh: loading…</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="install-btn" id="installButton" hidden>Install app</button>
        <div class="status-pill" id="globalStatus">Loading model…</div>
      </div>
    </header>

    <main class="layout">
      <section class="map-card" aria-label="California surf map">
        <div class="region-scroller" id="regionScroller" aria-label="Region selector">
          <button class="chip" data-region="all">All CA</button>
          <button class="chip is-active" data-region="san-diego">San Diego</button>
          <button class="chip" data-region="orange-county">Orange County</button>
          <button class="chip" data-region="los-angeles">Los Angeles</button>
          <button class="chip" data-region="ventura-sb">Ventura / SB</button>
          <button class="chip" data-region="central-coast">Central Coast</button>
          <button class="chip" data-region="monterey-bay">Monterey Bay</button>
          <button class="chip" data-region="bay-area">Bay Area</button>
          <button class="chip" data-region="north-coast">North Coast</button>
        </div>
        <div class="map-control-strip" aria-label="Map visual controls">
          <label class="mini-toggle"><input id="waveLayerToggle" type="checkbox" checked /> Wave layer</label>
          <button id="wavePlayPause" class="mini-button" type="button">Pause</button>
          <span id="waveFrameLabel" class="wave-frame-label">24h wave animation</span>
          <label class="marker-mode-label">Spot color
            <select id="markerColorMode">
              <option value="rating">Poor → fair/good</option>
              <option value="wave_size">Wave size</option>
              <option value="morning">Morning good</option>
              <option value="afternoon">Afternoon good</option>
              <option value="evening">Evening good</option>
            </select>
          </label>
        </div>
        <div id="map" class="map"></div>
      </section>

      <aside class="side-panel">
        <div class="search-row">
          <input id="spotSearch" type="search" placeholder="Search surf spots…" autocomplete="off" />
        </div>
        <div class="spot-list" id="spotList" aria-label="Surf spot list"></div>
      </aside>

      <section class="forecast-panel" id="forecastPanel" aria-live="polite">
        <div class="empty-state">Select a spot from the map or list.</div>
      </section>
    </main>
  </div>

  <div class="update-toast" id="updateToast" hidden>
    <strong>Update available</strong>
    <span>A newer CaliSurf Light version is ready.</span>
    <button id="updateButton">Download update</button>
    <button id="dismissUpdate" aria-label="Dismiss update notice">×</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
